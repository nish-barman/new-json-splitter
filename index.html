<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON File Splitter</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .container {
            background: white;
            border-radius: 16px;
            padding: 40px;
            max-width: 700px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: #f8f9ff;
        }
        
        .upload-area:hover {
            border-color: #764ba2;
            background: #f0f1ff;
        }
        
        .upload-area.dragover {
            border-color: #764ba2;
            background: #e8e9ff;
            transform: scale(1.02);
        }
        
        .upload-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }
        
        .upload-text {
            color: #333;
            font-size: 18px;
            margin-bottom: 8px;
        }
        
        .upload-hint {
            color: #999;
            font-size: 14px;
        }
        
        input[type="file"] {
            display: none;
        }
        
        .info-box {
            background: #f0f7ff;
            border-left: 4px solid #667eea;
            padding: 15px;
            margin: 20px 0;
            border-radius: 4px;
            display: none;
        }
        
        .info-box.show {
            display: block;
        }
        
        .info-item {
            margin: 8px 0;
            color: #333;
        }
        
        .info-label {
            font-weight: 600;
            color: #667eea;
        }
        
        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
            margin: 20px 0;
            display: none;
        }
        
        .progress-bar.show {
            display: block;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            width: 0%;
            transition: width 0.3s;
        }

        .status-text {
            text-align: center;
            color: #667eea;
            font-size: 14px;
            margin-top: -10px;
            margin-bottom: 10px;
            display: none;
        }

        .status-text.show {
            display: block;
        }
        
        .results {
            margin-top: 30px;
            display: none;
        }
        
        .results.show {
            display: block;
        }
        
        .result-item {
            background: #f8f9ff;
            border: 1px solid #e0e4ff;
            border-radius: 8px;
            padding: 15px;
            margin: 10px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .result-info {
            flex: 1;
        }
        
        .result-name {
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }
        
        .result-size {
            color: #666;
            font-size: 14px;
        }
        
        .download-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
        }
        
        .download-btn:hover {
            background: #5568d3;
        }
        
        .download-all-btn {
            background: #764ba2;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
            margin-top: 20px;
            transition: background 0.3s;
        }
        
        .download-all-btn:hover {
            background: #63408a;
        }
        
        .error {
            background: #ffe0e0;
            border-left: 4px solid #ff4444;
            color: #cc0000;
            padding: 15px;
            border-radius: 4px;
            margin: 20px 0;
            display: none;
        }
        
        .error.show {
            display: block;
        }
        
        .reset-btn {
            background: transparent;
            color: #667eea;
            border: 2px solid #667eea;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            margin-top: 15px;
            transition: all 0.3s;
        }
        
        .reset-btn:hover {
            background: #667eea;
            color: white;
        }

        .warning {
            background: #fff4e0;
            border-left: 4px solid #ff9800;
            color: #8B5A00;
            padding: 15px;
            border-radius: 4px;
            margin: 20px 0;
            display: none;
        }
        
        .warning.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📄 JSON File Splitter</h1>
        <p class="subtitle">Split large JSON files into smaller parts (max 16MB each)</p>
        
        <div class="upload-area" id="uploadArea">
            <div class="upload-icon">📁</div>
            <div class="upload-text">Click or drag & drop your JSON file here</div>
            <div class="upload-hint">Supports files up to 500MB</div>
            <input type="file" id="fileInput" accept=".json,application/json">
        </div>
        
        <div class="info-box" id="infoBox">
            <div class="info-item"><span class="info-label">File:</span> <span id="fileName"></span></div>
            <div class="info-item"><span class="info-label">Original Size:</span> <span id="fileSize"></span></div>
            <div class="info-item"><span class="info-label">Structure:</span> <span id="structure"></span></div>
            <div class="info-item"><span class="info-label">Parts created:</span> <span id="partsCount"></span></div>
        </div>
        
        <div class="progress-bar" id="progressBar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="status-text" id="statusText"></div>
        
        <div class="error" id="error"></div>
        <div class="warning" id="warning"></div>
        
        <div class="results" id="results">
            <h3 style="margin-bottom: 15px; color: #333;">✅ Split Complete!</h3>
            <div id="resultsList"></div>
            <button class="download-all-btn" id="downloadAll">📥 Download All Parts</button>
            <button class="reset-btn" onclick="location.reload()">🔄 Split Another File</button>
        </div>
    </div>

    <script>
        const MAX_SIZE_MB = 16;
        const MAX_SIZE_BYTES = MAX_SIZE_MB * 1024 * 1024;
        const TARGET_SIZE_BYTES = MAX_SIZE_BYTES * 0.90;
        let splitParts = [];
        let globalPartNum = 1;
        let globalBaseName = '';

        const uploadArea  = document.getElementById('uploadArea');
        const fileInput   = document.getElementById('fileInput');
        const infoBox     = document.getElementById('infoBox');
        const progressBar = document.getElementById('progressBar');
        const progressFill= document.getElementById('progressFill');
        const errorDiv    = document.getElementById('error');
        const warningDiv  = document.getElementById('warning');
        const results     = document.getElementById('results');
        const statusText  = document.getElementById('statusText');

        uploadArea.addEventListener('click', () => fileInput.click());

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file) handleFile(file);
        });

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) handleFile(file);
        });

        function formatBytes(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return Math.round((bytes / Math.pow(k, i)) * 100) / 100 + ' ' + sizes[i];
        }

        function showError(message) {
            errorDiv.textContent = '❌ ' + message;
            errorDiv.classList.add('show');
            progressBar.classList.remove('show');
            statusText.classList.remove('show');
        }

        function showWarning(message) {
            warningDiv.innerHTML += '⚠️ ' + message + '<br>';
            warningDiv.classList.add('show');
        }

        function hideError() {
            errorDiv.classList.remove('show');
            warningDiv.innerHTML = '';
            warningDiv.classList.remove('show');
        }

        function setStatus(msg, pct) {
            statusText.textContent = msg;
            statusText.classList.add('show');
            if (pct !== undefined) progressFill.style.width = pct + '%';
        }

        function getStringSize(str) {
            return new Blob([str]).size;
        }

        function savePart(jsonObj) {
            const jsonString = JSON.stringify(jsonObj, null, 2);
            const blob = new Blob([jsonString], { type: 'application/json' });
            const partName = `${globalBaseName}_part${globalPartNum}.json`;

            if (blob.size > MAX_SIZE_BYTES) {
                showWarning(`Part ${globalPartNum} (${partName}) is ${formatBytes(blob.size)} which still exceeds ${MAX_SIZE_MB}MB — individual element may be too large to split further.`);
            }

            splitParts.push({ name: partName, blob: blob, size: blob.size });
            globalPartNum++;
        }

        async function recursiveSplit(value, wrapFn) {
            const testSize = getStringSize(JSON.stringify(wrapFn(value), null, 2));

            if (testSize <= TARGET_SIZE_BYTES) {
                savePart(wrapFn(value));
                return;
            }

            if (Array.isArray(value)) {
                await splitArrayWithWrap(value, wrapFn);
            } else if (typeof value === 'object' && value !== null) {
                let bigKey = null, bigSize = 0;
                for (const k of Object.keys(value)) {
                    if (Array.isArray(value[k])) {
                        const s = getStringSize(JSON.stringify(value[k], null, 2));
                        if (s > bigSize) { bigSize = s; bigKey = k; }
                    }
                }

                if (bigKey) {
                    const nestedArray = value[bigKey];
                    const shell = { ...value, [bigKey]: [] };
                    await splitArrayWithWrap(
                        nestedArray,
                        chunk => wrapFn({ ...shell, [bigKey]: chunk })
                    );
                } else {
                    savePart(wrapFn(value));
                }
            } else {
                savePart(wrapFn(value));
            }
        }

        async function splitArrayWithWrap(arr, wrapFn) {
            let currentChunk = [];

            for (let i = 0; i < arr.length; i++) {
                const item = arr[i];

                const singleSize = getStringSize(JSON.stringify(wrapFn([item]), null, 2));
                if (singleSize > TARGET_SIZE_BYTES) {
                    if (currentChunk.length > 0) {
                        savePart(wrapFn(currentChunk));
                        currentChunk = [];
                    }
                    setStatus(`Deep splitting oversized item ${i + 1} of ${arr.length}…`);
                    await recursiveSplit(item, inner => wrapFn([inner]));
                    continue;
                }

                const testSize = getStringSize(JSON.stringify(wrapFn([...currentChunk, item]), null, 2));
                if (testSize > TARGET_SIZE_BYTES && currentChunk.length > 0) {
                    savePart(wrapFn(currentChunk));
                    currentChunk = [];
                }

                currentChunk.push(item);
            }

            if (currentChunk.length > 0) {
                savePart(wrapFn(currentChunk));
            }
        }

        async function handleFile(file) {
            hideError();
            results.classList.remove('show');
            splitParts = [];
            globalPartNum = 1;

            if (!file.name.endsWith('.json')) {
                showError('Please select a JSON file');
                return;
            }

            document.getElementById('fileName').textContent = file.name;
            document.getElementById('fileSize').textContent = formatBytes(file.size);
            infoBox.classList.add('show');
            progressBar.classList.add('show');
            setStatus('Reading file…', 20);

            try {
                const text = await file.text();
                setStatus('Parsing JSON…', 40);

                let data;
                try {
                    data = JSON.parse(text);
                } catch (e) {
                    showError('Invalid JSON file: ' + e.message);
                    return;
                }

                setStatus('Analysing structure…', 55);
                globalBaseName = file.name.replace(/\.json$/i, '');

                const fullSize = getStringSize(JSON.stringify(data, null, 2));
                if (fullSize <= MAX_SIZE_BYTES) {
                    document.getElementById('partsCount').textContent = '1 (no splitting needed)';
                    document.getElementById('structure').textContent = 'File under 16MB';
                    showError('File is already under 16MB. No splitting needed!');
                    errorDiv.style.background = '#e0f7e0';
                    errorDiv.style.borderLeft = '4px solid #44cc44';
                    errorDiv.style.color = '#006600';
                    progressBar.classList.remove('show');
                    statusText.classList.remove('show');
                    return;
                }

                setStatus('Splitting…', 65);

                if (Array.isArray(data)) {
                    document.getElementById('structure').textContent = `Array with ${data.length} items`;
                    await splitArrayWithWrap(data, chunk => chunk);
                } else if (typeof data === 'object') {
                    document.getElementById('structure').textContent = 'Object';
                    await recursiveSplit(data, v => v);
                } else {
                    showError('Unsupported JSON structure');
                    return;
                }

                document.getElementById('partsCount').textContent = splitParts.length;
                setStatus('Done!', 100);

                setTimeout(() => {
                    progressBar.classList.remove('show');
                    statusText.classList.remove('show');
                    results.classList.add('show');
                    displayResults();
                }, 500);

            } catch (error) {
                showError('Error processing file: ' + error.message);
                console.error(error);
            }
        }

        function displayResults() {
            const resultsList = document.getElementById('resultsList');
            resultsList.innerHTML = '';
            
            splitParts.forEach((part, index) => {
                const div = document.createElement('div');
                div.className = 'result-item';
                div.innerHTML = `
                    <div class="result-info">
                        <div class="result-name">${part.name}</div>
                        <div class="result-size">${formatBytes(part.size)}</div>
                    </div>
                    <button class="download-btn" onclick="downloadPart(${index})">Download</button>
                `;
                resultsList.appendChild(div);
            });
        }

        function downloadPart(index) {
            const part = splitParts[index];
            const url = URL.createObjectURL(part.blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = part.name;
            a.click();
            URL.revokeObjectURL(url);
        }

        document.getElementById('downloadAll').addEventListener('click', () => {
            splitParts.forEach((part, index) => {
                setTimeout(() => downloadPart(index), index * 200);
            });
        });
    </script>
</body>
</html>
